# 運用する6アカウントの設定。
# 企画エージェントと競合調査エージェントは、ここに書いた内容をもとに動きます。
# 方向性を変えたいときは、このファイルを書き換えるだけでOKです。
#
# research.youtubeQueries … YouTubeショートの検索語（「-語句」で除外できる）
# research.japaneseOnly   … 日本語タイトルの動画だけを調べるか（省略時は true）
#
# production（作り方）の種類:
#   polygon         … ポリゴン調の3Dに、数字・計器・地図・字幕を重ねる（コードで作るので生成費ほぼゼロ）
#   motion_graphics … 図解・テキストアニメーションのみ（コードで作るので生成費ほぼゼロ）
#   manga           … キャラを固定したAIのコマ画像をコマ送り・吹き出し・効果音で動かす漫画動画
#   ai_video        … 全編AI映像（動画生成AI）＋ナレーション
#
# active   … false にすると、企画も動画も作らない（休止）
# schedule … 企画を作る日。every: 2 なら2日に1回で、group 0 の組と group 1 の組が1日おきに交互に作る
#            （省略時は毎日）。group 0 は 2026-10-22 など、group 1 はその翌日
# sameAs   … 同じTikTokアカウントでもう1本作るとき、元のアカウントのIDを書く。設定を引き継ぎ、書いた項目だけ変わる
#            （label は Slack で名前のあとに出す呼び名。学び・BGM・参考動画は元のアカウントと共通）
#
# visual … 動画の見た目の方針。動画作成エージェントが毎回この方針にそろえる
# voice  … ナレーションの声（VOICEVOX のキャラクター名・スタイル名・速さ）
#          キャラクターごとに利用規約があるので、使う前に公式サイトで確認すること
# BGM    … public/bgm/<アカウントID>/ に入れた音源からランダムに選ぶ（sameAs のアカウントは元のアカウントのフォルダ）

accounts:
  - id: history
    name: 知られざる日本史
    genre: 日本史ミステリー・知られざる歴史
    concept: >-
      教科書の「常識」をくつがえす日本史の異説・新説・謎・伝承を、都市伝説を語るような不穏な語りで見せる短編ドキュメンタリー。
      「通説ではこう。でも実は――」で常識を揺さぶり、視聴者がコメントで「通説派か異説派か」を言い合いたくなる動画にする
    target: 20〜40代の歴史好き・雑学好き・都市伝説好き
    tone: >-
      都市伝説を語るような、低く静かで少し不穏な語り口。「教科書ではこう習いましたよね。でも――」と常識を揺さぶり、
      根拠を1つずつ突きつける。最後は答えを押しつけず、視聴者に判断をゆだねる
    production: polygon
    # レビューで冒頭2秒の離脱と長すぎが分かったため、まずは短くして最後まで見られることを優先する
    lengthSec: [35, 55]
    # 企画と台本の型。通説の逆を言うとコメントが集まるため、「常識をくつがえす異説」で物議をかもす構成にする
    format: >-
      「常識をくつがえす異説」の型。
      0〜3秒：誰もが知る通説を真っ向からくつがえす問いか「〜説」（例：「信長は本能寺で[死んでいない]？」）。hookText も同じ内容にする。
      通説の人物名・出来事名は冒頭で出してよいが、異説の核心（黒幕・正体・本当の理由）は伏せる。
      →「教科書ではこう習いました」と通説を一言で確認する →
      異説の根拠（史料の記述・矛盾・不自然な点・伝承）を1つずつ短く突きつける（mystery・tension の不穏な場面）→
      全体の6割までに異説の核心を出す → 通説側の反論を1文だけ入れる（公平に見せるほど議論が起きる）→
      最後の場面は余韻の残る一言で5秒以内に締める（暗転・締めの画面・「コメントで教えて」の呼びかけはなし）。
      「あなたは通説派？異説派？」のような意見が割れる2択は、投稿文（caption・postCaption）に書く。
      企画の hook には、その異説を1文で書き、basedOn に異説の出どころ（研究者・史料・伝承）を書く。
    research:
      youtubeQueries: ["日本史 雑学", "日本史 都市伝説", "歴史 黒幕 説", "教科書 変わった 日本史", "歴史 ミステリー"]
      webSearchHint: >-
        今週話題になっている日本史の新発見・発掘・研究ニュース、教科書の記述が変わった話題、研究者のあいだで議論になっている異説・新説、
        都市伝説めいた伝承、今週が記念日の歴史的出来事
    rules:
      - 異説・新説・俗説・伝承は、実際に唱えられている・伝わっているものだけを使い、出どころ（研究者・史料・伝承）を facts の根拠に書く。説を作らない
      - 異説を事実として断定しない。問いか「〜説」の形にし、字幕のラベル（「異説」「新説」「俗説」「伝承」「通説」）で一度示す
      - 物議は「常識をくつがえす説」で起こす。誰かを攻撃して起こさない（実在の人物や子孫を貶める表現をしない）
      - 近現代の戦争の評価や国同士の歴史認識の問題、災害や事件の被害、特定の民族・宗教・地域への偏見につながる話は扱わない
    visual: >-
      ポリゴン調の昔の日本（江戸の町並み・長屋・城・街道・古墳など）。夕暮れの暖色（橙・朱・土色）を基調にし、
      夜の場面は藍色。人物は顔のない単純な立体で、着物は色で表す。字幕の強調色は朱色。
      都市伝説のような不穏さを出す：mystery・tension の場面は暗い藍と黒に朱の差し色、霧、ゆっくり寄るカメラ、ちらつく灯り（Lantern の glow をフレームで揺らす）、
      人物は影（Person の silhouette）にする。異説の場面には朱色の「異説」の札（Tag）、通説の場面には白い「通説」の札を出す。
      幕末・明治以降の話では、本物の古写真（job.photos）があれば ArchivePhoto で見せ、CGの再現と切り替える。
    accent: "#ff6a3d"
    # 史実の場面で、本物の古写真（パブリックドメインなど自由に使えるもの）を Wikimedia Commons から探して使う
    archivePhotos: true
    voice: { speaker: 青山龍星, style: ノーマル, speed: 1.1 }
    postTime: "19:00"
    # 毎日作る（schedule を省略すると毎日）

  # 日本史の2本目（昼）。心理学のない日（group 0）に作る。設定は history を引き継ぐ
  - id: history_2
    sameAs: history
    label: 昼
    postTime: "12:30"
    schedule: { every: 2, group: 0 }
    # Claude API の費用を月100ドルに抑えるため休止（再開するときは true にする）
    active: false

  - id: urban_legend
    name: 夜更けの都市伝説
    genre: 都市伝説・怖い話
    concept: 日本や世界の都市伝説・不思議な話を、不穏な映像と朗読でじっくり聞かせる
    target: 10代後半〜30代の怖い話・オカルト好き
    tone: 低く静かな語り。ジャンプスケアに頼らず、じわじわ来る怖さ
    # 全編AI映像は費用が高いので、まずはポリゴン調3Dで作る（作り方を変えるときは ai_video に戻す）
    production: polygon
    lengthSec: [65, 90]
    research:
      # 「-語句」で除外できる（マイクラの「都市伝説」動画が混ざるため）
      youtubeQueries: ["都市伝説 怖い -マイクラ -マインクラフト", "怖い話 短編 -マイクラ", "意味がわかると怖い話"]
      webSearchHint: 今週SNSで話題になっている都市伝説・不思議な話・季節の怪談
    rules:
      - 実在の個人・企業・特定できる場所を、怖い話の舞台や加害者として扱わない
      - 心霊スポットなどへの立ち入りや迷惑行為をあおらない
      - 自傷・自殺を連想させる描写、過度にショッキングな描写をしない
      - 創作・伝承であることが分かる言い回しにする
    visual: >-
      ポリゴン調の、人のいない夜の日本（路地・街灯・電柱・踏切・団地・トンネル・山道・神社の鳥居など）。濃い霧と、黒・暗い青緑を基調にし、
      明かりは街灯や窓の弱い光だけ。人物は顔の見えない黒い人影で、はっきり映さず遠くや物陰に置く。暗い赤は1場面に1か所だけ差し色に使う。
      カメラはゆっくり動かし、じわじわ近づく。急に大きな顔や物が飛び出す驚かせ方はしない。画面の隅に「創作」「伝承」などの表記を出す。
    accent: "#c74b5a"
    voice: { speaker: 冥鳴ひまり, style: ノーマル, speed: 1.05 }
    postTime: "22:00"
    schedule: { every: 2, group: 1 }
    # TikTok アカウントができるまで休止（再開するときは true にする）
    active: false

  - id: cosmos
    name: 宇宙と深海のふしぎ
    genre: 深海サバイバルの続きもの物語（コメントで展開が決まる）
    concept: >-
      水深8000mで動けなくなった潜水艇のパイロット見習い「シズク」の生還を描く続きもの。毎話の最後に、シズクが次にとる行動を
      視聴者に2択で聞き、コメントで多かった方で次の話を作る。水圧・水温・酸素・発光生物など、深海の本当の科学が選択の重みになる。
    target: 10〜40代の科学・雑学好き、続きもののショートドラマ好き
    tone: シズクの一人称の独白。静かで緊迫感があり、ときどき深海の美しさに息をのむ。科学の数字で状況のきびしさを伝える
    production: polygon
    lengthSec: [65, 90]
    research:
      youtubeQueries: ["深海 サバイバル", "ショートドラマ 続き", "潜水艇 深海"]
      webSearchHint: 深海探査・潜水艇・深海生物の最新ニュース
    rules:
      - 物語は創作（フィクション）だが、深海の科学的な数値や現象は正確にする
      - 実在の潜水艇・機関・人物の名前は使わない（潜水艇は架空の「うみつばめ号」）
      - 視聴者を怖がらせすぎない。死や大けがをはっきり描かない
      - 画面の隅に「フィクション」と表示する
    series:
      title: 深海8000mからの生還
      premise: >-
        19歳の潜水艇パイロット見習い・シズクは、初めての単独潜航で水深8000mの海溝の底に着いた直後、潜水艇「うみつばめ号」の
        電源トラブルで浮上できなくなる。酸素は残り72時間。母船とは音響通信がときどきつながるだけ。重りを切り離す装置、
        予備電池、ロボットアーム、ライト、通信機など、限られた装備で生きて海面に戻ることを目指す。
      protagonist: >-
        シズク（雫）。19歳の女性、潜水艇パイロットの見習い。慎重だけど好奇心が強く、深海生物が大好き。一人称は「わたし」。
        見た目は部品集の Character（黒髪のボブ、オレンジのパイロットスーツ、ヘッドセット）。ナレーションはシズク自身の心の声。
      choiceRule: >-
        毎話の最後に、シズクが次にとる行動を2択（A・B）で聞く。どちらにも理由とリスクがあり、結果が読めないものにする。
        どちらを選んでも話は続け、すぐに終わらせない（全20話前後で生還する想定）。酸素の残り時間など、話の中の数字は話をまたいで一貫させる。
    visual: >-
      ポリゴン調の深海と潜水艇（外から見た潜水艇と、計器が並ぶ狭い操縦席の中）。深い青と黒を基調に、光るもの（発光生物・ライト・計器）を
      水色や黄色で目立たせる。試作「魚が絶対に行けない深さ」（大きな数字の計器・左の目盛り）の見た目を基準にする。
      画面上部に毎話同じ配置で「水深」「酸素の残り時間」「電池」を出す。「深海8000mからの生還　第N話」は画面の左上に小さなラベル（36px前後）で出し続ける。
      主人公シズクは部品集の Character、操縦席は Cockpit を使う。表情を場面の気持ちに合わせて変え、毎話かならず顔のアップを入れる。
    accent: "#ffcf3f"
    voice: { speaker: 九州そら, style: ノーマル, speed: 1.15 }
    postTime: "20:00"
    schedule: { every: 2, group: 0 }
    # 伸びなかったため休止（この日は日本史を2本作る）
    active: false

  - id: manga_story
    name: 深夜コンビニ物語（仮）
    genre: オリジナルキャラのショート漫画動画
    concept: |
      深夜のコンビニで働く大学生「ハル」と、毎晩やってくるクセの強い常連客たちの1話完結ストーリー。
      笑い・ちょっと泣ける・ちょっと不思議、のどれかでオチをつける。（キャラ設定は仮。変更可）
    target: 10〜30代のショート漫画・ストーリー動画好き
    tone: テンポのよい会話劇。最後の1コマでオチ
    production: manga
    lengthSec: [60, 80]
    research:
      youtubeQueries: ["ショート漫画 恋愛", "コンビニ あるある", "コンビニ 漫画"]
      webSearchHint: 今週の季節イベント・話題の新商品・SNSで話題の「あるある」ネタ
    rules:
      - 主要キャラの見た目・性格を毎回そろえる
      - 実在の店名・商品名・企業名を出さない
      - 特定の職業や客層を見下す笑いにしない
    visual: 白黒を基調にした漫画のコマ。夜のコンビニの蛍光灯の色を差し色にする。
    accent: "#ffd84a"
    voice: { speaker: 白上虎太郎, style: ふつう, speed: 1.15 }
    postTime: "21:00"
    # 漫画動画の作り方ができるまで休止
    active: false

  - id: psychology
    name: 心理学のあるある
    genre: 心理学・人間関係のあるある
    concept: 日常の「あるある」を心理学の知見でひもとき、明日使える小さなヒントで締める
    target: 18〜35歳の社会人・学生
    tone: やさしく共感的。説教くさくしない
    production: motion_graphics
    lengthSec: [60, 75]
    research:
      youtubeQueries: ["心理学 雑学", "職場 人間関係 あるある", "心理学 あるある"]
      webSearchHint: 今週話題の人間関係・職場・恋愛の悩みや、新しい心理学研究のニュース
    rules:
      - 医学的な診断のように断定しない（「〜の傾向がある」程度にとどめる）
      - 根拠のある心理学の知見を使い、俗説は俗説として扱う
      - 特定の性格・性別・属性を貶めない
    visual: >-
      白〜淡いベージュの背景に、丸みのあるアイコンと顔のない人型の図形。差し色は青緑と黄の2色。
      文字は大きく、1画面で伝えることは1つにする。
    accent: "#12a89a"
    voice: { speaker: 春日部つむぎ, style: ノーマル, speed: 1.15 }
    postTime: "12:30"
    # 宇宙と深海（group 0）と交互に、2日に1回作る
    schedule: { every: 2, group: 1 }

  - id: future
    name: 20XX年の日本
    genre: 未来予測・データで見る日本
    concept: 公的統計や研究機関の予測データをもとに「〇年後の日本」を、ポリゴン調の町とグラフで見せる
    target: 20〜40代のビジネス・社会問題に関心がある層
    tone: 冷静で分かりやすい。不安をあおらず、前向きな視点も添える
    production: polygon
    lengthSec: [65, 90]
    research:
      youtubeQueries: ["未来予測 日本", "2050年 日本", "人口 推計 日本"]
      # 海外から見た日本の未来像も参考になるので、英語の動画も対象にする
      japaneseOnly: false
      webSearchHint: 今週発表された政府統計・白書・研究機関の将来推計や、未来技術のニュース
    rules:
      - 数値には必ず出典（内閣府・総務省統計局・国立社会保障人口問題研究所など）を付ける
      - 予測は断定せず「〜という推計がある」と伝える
      - 政治的に一方へ偏った主張をしない
    visual: >-
      ポリゴン調の日本の町並み（住宅・駅・商店街・高層ビル・田畑）を舞台に、年表示・人口などのカウンターとグラフを重ねる。
      現在の場面は昼の自然な色、未来の場面は少し青みがかった色。数字は大きく、出典は画面下に小さく出し続ける。
    accent: "#3fd2ff"
    voice: { speaker: No.7, style: アナウンス, speed: 1.15 }
    postTime: "18:00"
    # いまは休止（再開するときは active: true にし、schedule を付ける）
    active: false
