# 運用する6アカウントの設定。
# 企画エージェントと競合調査エージェントは、ここに書いた内容をもとに動きます。
# 方向性を変えたいときは、このファイルを書き換えるだけでOKです。
#
# production（作り方）の種類:
#   ai_video        … 全編AI映像（動画生成AI）＋ナレーション
#   kamishibai      … AI静止画にカメラワーク（ズーム・パン・奥行き）を付けた「動く紙芝居」＋ナレーション
#   stock_footage   … NASAなどの公開映像を中心に、要所だけAI映像＋解説ナレーション
#   manga           … キャラを固定したAIのコマ画像をコマ送り・吹き出し・効果音で動かす漫画動画
#   motion_graphics … 図解・テキストアニメーションのみ（生成費ほぼゼロ）
#   data_viz        … 動くグラフ・地図＋AI静止画の情景

accounts:
  - id: history
    name: 知られざる日本史
    genre: 日本史ミステリー・知られざる歴史
    concept: 教科書には載らない日本史の謎や意外な真実を、1分強の短編ドキュメンタリーとして語る
    target: 20〜40代の歴史好き・雑学好き
    tone: 落ち着いた語り口。冒頭で強い問いを投げ、最後に余韻を残す
    production: kamishibai
    lengthSec: [65, 90]
    research:
      youtubeQueries: ["日本史 雑学", "歴史 ミステリー", "戦国時代 意外な事実"]
      webSearchHint: 今週話題になっている日本史の新発見・発掘・研究ニュース、今週が記念日の歴史的出来事
    rules:
      - 史実・有力説・俗説をはっきり区別して語る
      - 実在の人物や子孫を貶める表現をしない
    postTime: "19:00"

  - id: urban_legend
    name: 夜更けの都市伝説
    genre: 都市伝説・怖い話
    concept: 日本や世界の都市伝説・不思議な話を、不穏な映像と朗読でじっくり聞かせる
    target: 10代後半〜30代の怖い話・オカルト好き
    tone: 低く静かな語り。ジャンプスケアに頼らず、じわじわ来る怖さ
    production: ai_video
    lengthSec: [65, 90]
    research:
      youtubeQueries: ["都市伝説", "怖い話 短編", "意味がわかると怖い話"]
      webSearchHint: 今週SNSで話題になっている都市伝説・不思議な話・季節の怪談
    rules:
      - 実在の個人・企業・特定できる場所を、怖い話の舞台や加害者として扱わない
      - 心霊スポットなどへの立ち入りや迷惑行為をあおらない
      - 自傷・自殺を連想させる描写、過度にショッキングな描写をしない
      - 創作・伝承であることが分かる言い回しにする
    postTime: "22:00"

  - id: cosmos
    name: 宇宙と深海のふしぎ
    genre: 宇宙・深海・地球の不思議
    concept: 宇宙や深海の「信じられないけど本当」な事実を、実際の映像と解説で届ける
    target: 10〜40代の科学・雑学好き
    tone: ワクワク感のある語り。スケール感を数字と比喩で伝える
    production: stock_footage
    lengthSec: [65, 90]
    research:
      youtubeQueries: ["宇宙 雑学", "深海 生物", "地球 不思議 事実"]
      webSearchHint: 今週のNASA・JAXA・ESAの発表、天文現象、深海探査や新種発見のニュース
    rules:
      - 科学的事実と仮説・推測をはっきり区別する
      - 数値や事実はNASA・JAXA・学術機関などの公開情報に基づかせる
      - AI映像を使う場面は「イメージ映像」と分かるようにする
    postTime: "20:00"

  - id: manga_story
    name: 深夜コンビニ物語（仮）
    genre: オリジナルキャラのショート漫画動画
    concept: |
      深夜のコンビニで働く大学生「ミナト」と、毎晩やってくるクセの強い常連客たちの1話完結ストーリー。
      笑い・ちょっと泣ける・ちょっと不思議、のどれかでオチをつける。（キャラ設定は仮。変更可）
    target: 10〜30代のショート漫画・ストーリー動画好き
    tone: テンポのよい会話劇。最後の1コマでオチ
    production: manga
    lengthSec: [60, 80]
    research:
      youtubeQueries: ["漫画動画 ショート", "スカッと 漫画", "コンビニ あるある"]
      webSearchHint: 今週の季節イベント・話題の新商品・SNSで話題の「あるある」ネタ
    rules:
      - 主要キャラの見た目・性格を毎回そろえる
      - 実在の店名・商品名・企業名を出さない
      - 特定の職業や客層を見下す笑いにしない
    postTime: "21:00"

  - id: psychology
    name: 心理学のあるある
    genre: 心理学・人間関係のあるある
    concept: 日常の「あるある」を心理学の知見でひもとき、明日使える小さなヒントで締める
    target: 18〜35歳の社会人・学生
    tone: やさしく共感的。説教くさくしない
    production: motion_graphics
    lengthSec: [60, 75]
    research:
      youtubeQueries: ["心理学 雑学", "人間関係 あるある", "心理テクニック"]
      webSearchHint: 今週話題の人間関係・職場・恋愛の悩みや、新しい心理学研究のニュース
    rules:
      - 医学的な診断のように断定しない（「〜の傾向がある」程度にとどめる）
      - 根拠のある心理学の知見を使い、俗説は俗説として扱う
      - 特定の性格・性別・属性を貶めない
    postTime: "12:30"

  - id: future
    name: 20XX年の日本
    genre: 未来予測・データで見る日本
    concept: 公的統計や研究機関の予測データをもとに「〇年後の日本」をグラフと未来の情景で見せる
    target: 20〜40代のビジネス・社会問題に関心がある層
    tone: 冷静で分かりやすい。不安をあおらず、前向きな視点も添える
    production: data_viz
    lengthSec: [65, 90]
    research:
      youtubeQueries: ["未来予測 日本", "2050年 日本", "データで見る日本"]
      webSearchHint: 今週発表された政府統計・白書・研究機関の将来推計や、未来技術のニュース
    rules:
      - 数値には必ず出典（内閣府・総務省統計局・国立社会保障人口問題研究所など）を付ける
      - 予測は断定せず「〜という推計がある」と伝える
      - 政治的に一方へ偏った主張をしない
    postTime: "18:00"
