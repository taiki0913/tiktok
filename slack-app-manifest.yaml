# Slackアプリの設定ファイル。
# https://api.slack.com/apps →「Create New App」→「From a manifest」でこの内容を貼り付けると、必要な設定が一度に入ります。
display_information:
  name: TikTok企画エージェント
  description: 毎朝6アカウント分のTikTok企画を届け、承認を受け付けます
  background_color: "#1f2937"
features:
  bot_user:
    display_name: tiktok-agent   # 半角英小文字・数字・ハイフンのみ使える
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # 企画の投稿・更新
      - channels:history    # 参考動画URLや「企画作成」の書き込みを読む（公開チャンネル）
      - groups:history      # 同上（プライベートチャンネル）
      - files:write         # 次のフェーズで完成動画のプレビューを送るため
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
